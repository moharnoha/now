<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - تسجيل الدخول</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        .login-btn { background-color: white; color: #444; border: 1px solid #ddd; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: 0.3s; }
        .login-btn:hover { background-color: #f9f9f9; border-color: #bbb; }
        #dashboard { display: none; }
        .balance-card { background: #4285F4; color: white; padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 22px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: right; }
        th { color: #666; }
        .negative { color: #e74c3c; font-weight: bold; }
        .logout-btn { color: #888; background: none; border: none; cursor: pointer; text-decoration: underline; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="40">
        <h2>مرحباً بك</h2>
        <p>قم بتسجيل الدخول للوصول إلى محفظتك</p>
        <button class="login-btn" id="btn-login">تسجيل الدخول بواسطة Google</button>
    </div>

    <div id="dashboard">
        <h3 id="welcome-msg">مرحباً</h3>
        <div class="balance-card">
            رصيدك: <span id="user-balance">0.00</span> $
        </div>
        
        <h4>سجل العمليات</h4>
        <table>
            <thead>
                <tr>
                    <th>الخدمة</th>
                    <th>المبلغ</th>
                    <th>التاريخ</th>
                </tr>
            </thead>
            <tbody id="transaction-rows">
                </tbody>
        </table>
        <button class="logout-btn" id="btn-logout">تسجيل الخروج</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCP0N4c2WP2RuObIfXf9y2Rx8ZWHrffh7Q",
        authDomain: "serviocmm-aa290.firebaseapp.com",
        projectId: "serviocmm-aa290",
        storageBucket: "serviocmm-aa290.firebasestorage.app",
        messagingSenderId: "269781026726",
        appId: "1:269781026726:web:21b94084ad631a70feb167"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // تسجيل الدخول
    document.getElementById('btn-login').onclick = () => signInWithPopup(auth, provider);
    // تسجيل الخروج
    document.getElementById('btn-logout').onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
        const loginSection = document.getElementById('login-section');
        const dashboard = document.getElementById('dashboard');

        if (user) {
            loginSection.style.display = 'none';
            dashboard.style.display = 'block';
            document.getElementById('welcome-msg').innerText = "مرحباً " + user.displayName;

            // 1. جلب الرصيد
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);
            if (userSnap.exists()) {
                document.getElementById('user-balance').innerText = userSnap.data().balance;
            }

            // 2. جلب جدول العمليات (الذي أنشأته أنت يدوياً)
            const q = query(collection(db, "transactions"), where("userId", "==", user.uid));
            const querySnapshot = await getDocs(q);
            const tableBody = document.getElementById('transaction-rows');
            tableBody.innerHTML = ""; 

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.date ? data.date.toDate().toLocaleDateString('ar-MA') : '-';
                tableBody.innerHTML += `
                    <tr>
                        <td>${data.service || 'خدمة غير محددة'}</td>
                        <td class="negative">${data.amount} $</td>
                        <td>${date}</td>
                    </tr>`;
            });
        } else {
            loginSection.style.display = 'block';
            dashboard.style.display = 'none';
        }
    });
</script>
</body>
</html>
