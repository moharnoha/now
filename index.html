<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Wallet System</title>
    </head>
<body>

    <button id="login-google">تسجيل الدخول عبر Google</button>

    <script type="module">
        // 1. استيراد المكتبات اللازمة
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 2. إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCP0N4c2WP2RuObIfXf9y2Rx8ZWHrffh7Q",
            authDomain: "serviocmm-aa290.firebaseapp.com",
            projectId: "serviocmm-aa290",
            storageBucket: "serviocmm-aa290.firebasestorage.app",
            messagingSenderId: "269781026726",
            appId: "1:269781026726:web:21b94084ad631a70feb167"
        };

        // 3. تهيئة الخدمات
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 4. وظيفة تسجيل الدخول التلقائي
        const loginBtn = document.getElementById('login-google');
        
        loginBtn.onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // مرجع لمستند المستخدم باستخدام UID الخاص به
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                // إذا كان المستخدم لا يملك ملفاً، أنشئه له تلقائياً
                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        NAME: user.displayName || "مستخدم جديد",
                        balance: 0,
                        total_spend: 0,
                        email: user.email,
                        createdAt: new Date()
                    });
                    console.log("تم إنشاء المحفظة تلقائياً!");
                }

                alert("تم تسجيل الدخول بنجاح يا " + user.displayName);
                window.location.reload(); 

            } catch (error) {
                console.error("خطأ في العملية:", error);
                alert("فشل تسجيل الدخول، تأكد من إعدادات القواعد (Rules)");
            }
        };
    </script>
</body>
</html>
